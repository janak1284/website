name: Deploy FastAPI to Azure VM
on:
  push:
    branches:
      - design1
    paths:
      - 'backend/**'
  workflow_dispatch: # This single line adds the manual trigger button

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VM and run deploy script
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            ./deploy.sh
